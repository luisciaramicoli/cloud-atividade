# =============================================================================
# PostCraft AI · Docker Compose de Produção (Imagens GHCR & Auto-Deploy Watchtower)
# =============================================================================
# Este compose utiliza as imagens empacotadas e publicadas pelo GitHub Actions no
# GitHub Container Registry (GHCR), amarradas às tags de commit ou latest.
# =============================================================================

services:
  app:
    image: ghcr.io/${GHCR_OWNER:-luisciaramicoli}/postcraft-app:${IMAGE_TAG:-latest}
    ports:
      - "${PORT_APP:-8218}:3000"
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-cloud123}
      - DB_PASS=${DB_PASSWORD:-cloud123}
      - DB_NAME=${DB_NAME:-postcraft_db}
      - JWT_SECRET=${JWT_SECRET:-postcraft_super_secret_jwt_token_2026_key_secure}
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth:3000
      - LOG_SERVICE_URL=http://log-service:3000
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - TRUST_PROXY=${TRUST_PROXY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - GRAFANA_HOST=grafana
      - GRAFANA_PORT=3000
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_BUCKET=avatars
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_ACCOUNT_ID=${STRIPE_ACCOUNT_ID:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID:-}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8218}
    depends_on:
      - auth
      - log-service
      - minio
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  auth:
    image: ghcr.io/${GHCR_OWNER:-luisciaramicoli}/postcraft-auth:${IMAGE_TAG:-latest}
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-cloud123}
      - DB_PASS=${DB_PASSWORD:-cloud123}
      - DB_NAME=${DB_NAME:-postcraft_db}
      - JWT_SECRET=${JWT_SECRET:-postcraft_super_secret_jwt_token_2026_key_secure}
      - NODE_ENV=production
      - SMTP_HOST=${SMTP_HOST:-sandbox.smtp.mailtrap.io}
      - SMTP_PORT=${SMTP_PORT:-2525}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8218}
      - PORT=3000
      - LOG_SERVICE_URL=http://log-service:3000
    depends_on:
      - log-service
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  log-service:
    image: ghcr.io/${GHCR_OWNER:-luisciaramicoli}/postcraft-log-service:${IMAGE_TAG:-latest}
    environment:
      - JWT_SECRET=${JWT_SECRET:-postcraft_super_secret_jwt_token_2026_key_secure}
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
      - REDIS_STREAM_KEY=audit_events
      - REDIS_STREAM_MAXLEN=50000
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 5s
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_audit_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 2
    restart: always

  minio:
    image: ghcr.io/${GHCR_OWNER:-luisciaramicoli}/cinecloud-minio:${IMAGE_TAG:-latest}
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-miniopassword123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - app
      - auth
      - log-service
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-AdminPostcraft2026!}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_COOKIE_SAMESITE=lax
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/cinecloud_dashboard.json
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always

  # Watchtower: monitora o GHCR e atualiza os containers automaticamente a cada 60s
  watchtower:
    image: containrrr/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_LABEL_ENABLE=true
    restart: always

volumes:
  redis_audit_data:
  prometheus_data:
  grafana_data:
  minio_data:
