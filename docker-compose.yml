services:
  app:
    build: .
    ports:
      - "8218:3000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PASS=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth:3000
      - LOG_SERVICE_URL=http://log-service:3000
    depends_on:
      - auth
      - log-service
    restart: always

  auth:
    build: ./auth-service
    # Sem porta exposta para fora (internal only)
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PASS=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST:-sandbox.smtp.mailtrap.io}
      - SMTP_PORT=${SMTP_PORT:-2525}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8218}
      - PORT=3000
      - LOG_SERVICE_URL=http://log-service:3000
    depends_on:
      - log-service
    restart: always

  log-service:
    build: ./log-service
    # Sem porta exposta para fora (internal only)
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
      - REDIS_STREAM_KEY=audit_events
      - REDIS_STREAM_MAXLEN=50000
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_audit_data:/data
    restart: always

volumes:
  redis_audit_data:
